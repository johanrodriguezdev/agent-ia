<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<title>Error</title>
<style>
  :root { --bg: #ffffff; --text: #24292f; --muted: #57606a; --accent: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; padding: 32px; max-width: 420px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  button {
    background: var(--accent); color: #ffffff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>No se pudo cargar la interfaz</h1>
    <p>Ocurrió un problema al cargar el panel. Podés intentar de nuevo.</p>
    <button type="button" onclick="location.href='index.html'">Reintentar</button>
  </div>
</body>
</html>
