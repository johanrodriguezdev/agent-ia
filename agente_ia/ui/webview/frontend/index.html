<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
<title>Panel de control</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/controles.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/composer.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/settings_panel.css">
<link rel="stylesheet" href="css/marca.css">
<link rel="stylesheet" href="css/map_panel.css">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="css/terminal.css">
<link rel="stylesheet" href="css/toasts.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pygments-dark.css" id="pygments-dark-link">
<link rel="stylesheet" href="css/pygments-light.css" id="pygments-light-link">
<!-- theme.js habilita/deshabilita uno u otro según data-theme — ambos declaran las mismas
     clases .codehilite/.token, así que solo uno debe estar activo a la vez (ver theme.js). -->
</head>
<body>

<!-- Sprite de iconos: cada símbolo se define UNA vez acá y se referencia con
     <use href="#ic-...">. El trazo, el tamaño y el color los pone css/icons.css sobre el
     <svg> que referencia (son propiedades heredadas), así que los <path> van sin atributos
     de presentación propios. Trazo geométrico de 24×24, estilo Lucide. -->
<svg id="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-terminal" viewBox="0 0 24 24">
    <path d="M5 8l3.5 4L5 16"/><path d="M12.5 16H19"/>
  </symbol>
  <symbol id="ic-tasks" viewBox="0 0 24 24">
    <path d="M3 6.5l2 2 3.5-3.5"/><path d="M3 16.5l2 2 3.5-3.5"/>
    <path d="M12 7h9"/><path d="M12 17h9"/>
  </symbol>
  <symbol id="ic-flows" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7" height="6" rx="1.5"/>
    <rect x="14" y="15" width="7" height="6" rx="1.5"/>
    <path d="M6.5 9v4a2 2 0 0 0 2 2h9"/>
  </symbol>
  <symbol id="ic-folder" viewBox="0 0 24 24">
    <path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
  </symbol>
  <symbol id="ic-settings" viewBox="0 0 24 24">
    <path d="M4 8h5"/><path d="M13 8h7"/><circle cx="11" cy="8" r="2"/>
    <path d="M4 16h9"/><path d="M17 16h3"/><circle cx="15" cy="16" r="2"/>
  </symbol>
  <symbol id="ic-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>
  </symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24">
    <path d="M12 5.5v13"/><path d="M5.5 12h13"/>
  </symbol>
  <symbol id="ic-panel-left" viewBox="0 0 24 24">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>
  </symbol>
  <symbol id="ic-paperclip" viewBox="0 0 24 24">
    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57a4 4 0 0 1 5.66 5.66l-8.58 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
  </symbol>
  <symbol id="ic-mic" viewBox="0 0 24 24">
    <path d="M12 3.5a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0v-5a3 3 0 0 1 3-3z"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5v3"/><path d="M9 20.5h6"/>
  </symbol>
  <!-- REQ-026 addendum 1: sin ícono de "recordatorio" reutilizable en el set existente
       (ver ui-design-026-addendum-1.md §4) — usado por "Recuérdame algo" en el composer. -->
  <symbol id="ic-bell" viewBox="0 0 24 24">
    <path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 5 2 6.5 2 6.5h-15s2-1.5 2-6.5z"/>
    <path d="M10 19.5a2 2 0 0 0 4 0"/>
  </symbol>
  <symbol id="ic-send" viewBox="0 0 24 24">
    <path d="M12 19.5V5.5"/><path d="M6 11.5l6-6 6 6"/>
  </symbol>
  <symbol id="ic-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 3v2"/><path d="M12 19v2"/><path d="M3 12h2"/><path d="M19 12h2"/>
    <path d="M5.6 5.6L7 7"/><path d="M17 17l1.4 1.4"/><path d="M18.4 5.6L17 7"/><path d="M7 17l-1.4 1.4"/>
  </symbol>
  <symbol id="ic-moon" viewBox="0 0 24 24">
    <path d="M20.5 14.8A8.5 8.5 0 0 1 9.2 3.5a7.5 7.5 0 1 0 11.3 11.3z"/>
  </symbol>
  <symbol id="ic-minimize" viewBox="0 0 24 24">
    <path d="M6 12h12"/>
  </symbol>
  <symbol id="ic-maximize" viewBox="0 0 24 24">
    <rect x="6.5" y="6.5" width="11" height="11" rx="2"/>
  </symbol>
  <symbol id="ic-close" viewBox="0 0 24 24">
    <path d="M7 7l10 10"/><path d="M17 7L7 17"/>
  </symbol>
  <symbol id="ic-play" viewBox="0 0 24 24">
    <path d="M8 5.5l10 6.5-10 6.5z"/>
  </symbol>
  <symbol id="ic-alerta" viewBox="0 0 24 24">
    <path d="M12 4.5l8.5 14.5H3.5z"/><path d="M12 10v4"/><path d="M12 16.6v.1"/>
  </symbol>
  <symbol id="ic-check" viewBox="0 0 24 24">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>
  <symbol id="ic-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/>
  </symbol>
  <symbol id="ic-copiar" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="11" rx="2"/>
    <path d="M15 5.5H6a1.5 1.5 0 0 0-1.5 1.5v9"/>
  </symbol>
  <symbol id="ic-stop" viewBox="0 0 24 24">
    <rect x="7" y="7" width="10" height="10" rx="2"/>
  </symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24">
    <path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v4h-4"/>
  </symbol>
  <symbol id="ic-lapiz" viewBox="0 0 24 24">
    <path d="M4.5 19.5h4L19 9a2.1 2.1 0 0 0-3-3L5.5 16.5z"/><path d="M14.5 7.5l2.5 2.5"/>
  </symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24">
    <path d="M7 10l5 5 5-5"/>
  </symbol>
  <symbol id="ic-cpu" viewBox="0 0 24 24">
    <rect x="7" y="7" width="10" height="10" rx="2"/>
    <path d="M10 4.5v2.5"/><path d="M14 4.5v2.5"/><path d="M10 17v2.5"/><path d="M14 17v2.5"/>
    <path d="M4.5 10H7"/><path d="M4.5 14H7"/><path d="M17 10h2.5"/><path d="M17 14h2.5"/>
  </symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24">
    <path d="M4.5 7h15"/><path d="M9.5 7V5.5h5V7"/>
    <path d="M6.5 7l1 11.5a1.5 1.5 0 0 0 1.5 1.4h6a1.5 1.5 0 0 0 1.5-1.4L18 7"/>
  </symbol>
  <!-- REQ-052 — el Mapa de conexiones y los nodos que dibuja -->
  <symbol id="ic-map" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="2.6"/>
    <circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/>
    <path d="M10.1 10.5L6.5 7.4"/><path d="M13.9 10.5l3.6-3.1"/><path d="M12 14.6V18"/>
  </symbol>
  <symbol id="ic-monitor" viewBox="0 0 24 24">
    <rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7"/><path d="M12 17v3.5"/>
  </symbol>
  <symbol id="ic-mail" viewBox="0 0 24 24">
    <rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7.5l8.5 5.8 8.5-5.8"/>
  </symbol>
  <symbol id="ic-message" viewBox="0 0 24 24">
    <path d="M4.5 5h15A1.5 1.5 0 0 1 21 6.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.6V16h-1A1.5 1.5 0 0 1 3 14.5v-8A1.5 1.5 0 0 1 4.5 5z"/>
  </symbol>
  <symbol id="ic-plug" viewBox="0 0 24 24">
    <path d="M9 3v4.5"/><path d="M15 3v4.5"/>
    <path d="M6.5 7.5h11v3.5a5.5 5.5 0 0 1-11 0z"/><path d="M12 16.5V21"/>
  </symbol>
</svg>

<div id="app-shell">

  <!-- Barra superior: identidad · buscador · herramientas + controles de ventana.
       Las zonas interactivas llevan `data-no-drag` para que window_chrome.js no dispare
       `startSystemMove()` cuando el click era para un botón o para el input. -->
  <div id="window-chrome">
    <div id="chrome-left">
      <span id="brand-mark" aria-hidden="true"></span>
      <span id="agent-name-label"></span>
      <!-- REQ-033 — el modo autonomia no expira solo (decision de Johan), asi que la
           mitigacion es que sea imposible no verlo mientras este encendido. -->
      <span id="autonomy-badge" hidden title="Modo autonomia encendido"></span>
    </div>

    <div id="chrome-center" data-no-drag>
      <div id="conv-search">
        <svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg>
        <input type="search" id="conv-search-input" aria-label="Buscar conversaciones"
               placeholder="Buscar conversaciones">
        <kbd>Ctrl K</kbd>
      </div>
    </div>

    <div id="chrome-right" data-no-drag>
      <div id="topbar-tools">
        <button type="button" id="terminal-btn" class="icon-btn" aria-label="Terminal"
                title="Terminal (PowerShell)">
          <svg class="ic" aria-hidden="true"><use href="#ic-terminal"/></svg>
        </button>
        <button type="button" id="tasks-btn" class="icon-btn" aria-label="Tareas" title="Tareas">
          <svg class="ic" aria-hidden="true"><use href="#ic-tasks"/></svg>
        </button>
        <button type="button" id="flows-btn" class="icon-btn" aria-label="Flujos" title="Flujos">
          <svg class="ic" aria-hidden="true"><use href="#ic-flows"/></svg>
        </button>
        <button type="button" id="projects-btn" class="icon-btn" aria-label="Proyectos" title="Proyectos">
          <svg class="ic" aria-hidden="true"><use href="#ic-folder"/></svg>
        </button>
        <button type="button" id="map-btn" class="icon-btn" aria-label="Mapa de conexiones"
                title="Mapa de conexiones">
          <svg class="ic" aria-hidden="true"><use href="#ic-map"/></svg>
        </button>
        <button type="button" id="settings-btn" class="icon-btn" aria-label="Configuración" title="Configuración">
          <svg class="ic" aria-hidden="true"><use href="#ic-settings"/></svg>
        </button>
      </div>

      <span class="chrome-sep" aria-hidden="true"></span>

      <div id="window-controls">
        <button type="button" id="btn-minimize" class="window-btn" aria-label="Minimizar" title="Minimizar">
          <svg class="ic" aria-hidden="true"><use href="#ic-minimize"/></svg>
        </button>
        <button type="button" id="btn-maximize" class="window-btn" aria-label="Maximizar" title="Maximizar">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-maximize"/></svg>
        </button>
        <button type="button" id="btn-close" class="window-btn window-btn-close" aria-label="Cerrar" title="Cerrar">
          <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="app-body">

    <aside id="sidebar">
      <div id="sidebar-top">
        <button type="button" id="new-conversation-btn" title="Nuevo chat">
          <svg class="ic" aria-hidden="true"><use href="#ic-plus"/></svg>
          <span class="label">Nuevo chat</span>
        </button>
        <button type="button" id="sidebar-collapse-toggle" class="icon-btn"
                aria-label="Colapsar panel lateral" title="Colapsar panel lateral">
          <svg class="ic" aria-hidden="true"><use href="#ic-panel-left"/></svg>
        </button>
      </div>

      <div class="sidebar-section sidebar-section-proyectos">
        <span class="label">Proyectos</span>
        <button type="button" id="project-add-btn" class="icon-btn icon-btn-xs"
                aria-label="Nuevo proyecto" title="Nuevo proyecto">
          <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-plus"/></svg>
        </button>
      </div>
      <div id="project-list" role="list"></div>

      <div class="sidebar-section"><span class="label">Recientes</span></div>

      <div id="conversation-list" role="list"></div>
      <button type="button" id="load-more-btn" class="sidebar-load-more" hidden>
        Ver más
      </button>

      <div id="sidebar-footer">
        <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="Cambiar tema"
                title="Cambiar tema">
          <svg class="ic" aria-hidden="true"><use href="#ic-sun" id="theme-toggle-icon"/></svg>
        </button>
      </div>
    </aside>

    <main id="main-column">

      <!-- REQ-058: buscar dentro de la conversación (Ctrl+F); js/buscar_en_chat.js.
           Hermana de #chat-area, no hija: flota sobre el chat sin desplazarse con él. -->
        <div id="buscar-en-chat" role="search" aria-label="Buscar en la conversación" hidden>
          <svg class="ic ic-sm buscar-en-chat-icono" aria-hidden="true"><use href="#ic-search"/></svg>
          <input id="buscar-en-chat-input" type="text" placeholder="Buscar en la conversación…"
                 autocomplete="off" spellcheck="false" aria-label="Texto a buscar">
          <span id="buscar-en-chat-contador" aria-live="polite"></span>
          <button type="button" id="buscar-en-chat-anterior" class="buscar-en-chat-btn" title="Anterior (Shift+Enter)" aria-label="Hallazgo anterior">
            <svg class="ic ic-sm buscar-en-chat-arriba" aria-hidden="true"><use href="#ic-chevron"/></svg>
          </button>
          <button type="button" id="buscar-en-chat-siguiente" class="buscar-en-chat-btn" title="Siguiente (Enter)" aria-label="Hallazgo siguiente">
            <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevron"/></svg>
          </button>
          <button type="button" id="buscar-en-chat-cerrar" class="buscar-en-chat-btn" title="Cerrar (Esc)" aria-label="Cerrar la búsqueda">
            <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-close"/></svg>
          </button>
        </div>
      <div id="chat-area">
        <div id="empty-state">
          <div id="empty-state-avatar" aria-hidden="true"></div>
          <h1 id="empty-state-greeting"></h1>
          <p id="empty-state-subtitle">¿En qué puedo ayudarte hoy?</p>
        </div>
        <div id="messages" class="content-col" role="log" aria-live="polite"></div>
        <!-- REQ-057: la marca gira mientras el agente piensa (chat.js la monta) -->
        <div id="typing-indicator" class="content-col" hidden>
          <span id="typing-marca" aria-hidden="true"></span>
          <span id="progress-text" aria-live="polite"></span>
        </div>
      </div>

      <div id="composer">
        <div id="composer-inner" class="content-col">
          <div id="actions-row"></div>

          <div id="composer-input-row">
            <textarea id="composer-input" rows="1" placeholder="Escribe un mensaje…"></textarea>
            <div id="composer-actions">
              <button type="button" id="attach-btn" class="icon-btn"
                      aria-label="Adjuntar archivo" title="Adjuntar archivo">
                <svg class="ic" aria-hidden="true"><use href="#ic-paperclip"/></svg>
              </button>
              <button type="button" id="model-btn" class="model-btn"
                      aria-label="Elegir el modelo" title="Con qué modelo responde">
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-cpu"/></svg>
                <span id="model-btn-label">…</span>
                <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-chevron"/></svg>
              </button>
              <div id="composer-actions-right">
                <button type="button" id="wake-toggle-btn" class="icon-btn"
                        aria-label="Modo manos libres" title="Modo manos libres"
                        data-wake-state="INACTIVE">
                  <svg class="ic" aria-hidden="true"><use href="#ic-mic"/></svg>
                </button>
                <button type="button" id="stop-btn" class="icon-btn composer-stop-btn"
                        aria-label="Detener la respuesta" title="Detener la respuesta" hidden>
                  <svg class="ic" aria-hidden="true"><use href="#ic-stop"/></svg>
                </button>
                <button type="button" id="send-btn" class="icon-btn composer-send-btn"
                        aria-label="Enviar mensaje" title="Enviar mensaje">
                  <svg class="ic" aria-hidden="true"><use href="#ic-send"/></svg>
                </button>
              </div>
            </div>
          </div>

          <div id="attachment-chip" hidden>
            <!-- REQ-054: miniatura si el adjunto es una imagen (src la pone composer.js) -->
            <img id="attachment-chip-thumb" alt="" hidden>
            <svg class="ic ic-sm attachment-chip-icon" aria-hidden="true"><use href="#ic-paperclip"/></svg>
            <span id="attachment-chip-name"></span>
            <button type="button" id="attachment-chip-remove" aria-label="Quitar adjunto">
              <svg class="ic ic-sm" aria-hidden="true"><use href="#ic-close"/></svg>
            </button>
          </div>

          <!-- REQ-053 — ejemplos de qué pedir; solo con la conversación vacía (chat.css) -->
          <div id="sugerencias" aria-label="Ejemplos de qué pedir"></div>
        </div>
      </div>

    </main>

  </div>

</div>

<!-- Capa que aparece al arrastrar un archivo sobre la ventana: sin esto, el drag&drop
     funcionaba pero no se veía por ninguna parte que se pudiera soltar. -->
<div id="drop-overlay" hidden>
  <div id="drop-overlay-card">
    <svg class="ic ic-lg" aria-hidden="true"><use href="#ic-paperclip"/></svg>
    <span>Soltá el archivo para adjuntarlo</span>
  </div>
</div>

<div id="confirm-modal-root"></div>
<div id="panel-modal-root"></div>

<script src="vendor/qwebchannel.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="vendor/xterm-addon-search.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
